name: Fetch jobs hourly

on:
  schedule:
    - cron: "7 * * * *"      # every hour, at 7 minutes past
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas openpyxl

      - name: Update H-1B employer list (only when LCA_URL changes)
        continue-on-error: true
        env:
          LCA_URL: ${{ vars.LCA_URL }}
        run: python build_sponsors.py

      - name: Fetch new jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOB_LOCATION: ${{ vars.JOB_LOCATION }}
        run: python fetch_jobs.py

      - name: Save jobs.json
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add jobs.json sponsors.json 2>/dev/null || git add jobs.json
          if ! git diff --staged --quiet; then
            git commit -m "Update jobs"
            git push
          fi

      - name: Email me about new jobs
        if: ${{ hashFiles('new_jobs.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "$(cat new_jobs_title.txt)" \
            --body-file new_jobs.md \
            --assignee "${{ github.repository_owner }}"
